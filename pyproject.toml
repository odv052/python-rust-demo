[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fuzzy-rs"
version = "0.1.0"
description = "Demo: turning a Python bottleneck into a Rust module"
requires-python = ">=3.12"

[tool.maturin]
module-name = "fuzzy_rs"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
